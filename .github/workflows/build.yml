name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: sudo apt-get update && sudo apt-get install -y zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - run: pip install buildozer cython setuptools
    - run: buildozer init || true
    - run: buildozer android debug || buildozer android debug
    - run: find . -name "*.apk" -type f
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: wechat-reply-apk
        path: '**/*.apk'
        if-no-files-found: error
